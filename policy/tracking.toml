refs = "project.refs"

[component.gnu-ctags]
# GNU etags' ctags mode, without installing the editor (D69). GNU Git is authoritative.
url = "https://git.savannah.gnu.org/git/emacs.git"
branch = "master"
elements = ["posix-devel/ctags.bst"]
refs = "project.refs"
select = "github-archive"
github = "emacs-mirror/emacs"
commit_file = "include/posix-devel/emacs-commit.yml"
commit_variable = "emacs-commit"

[component.gnu-time]
