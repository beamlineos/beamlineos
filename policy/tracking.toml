[fixed]
"junctions/buildstream-plugins.bst" = "buildstream-plugins 2.8.0 (PyPI sdist)"
"junctions/buildstream-plugins-community.bst" = "buildstream-plugins-community 2.3.3 (PyPI sdist)"

# The patched Shell inherits the exact GNOME source set, including its two subprojects.
# It is not a separate HEAD track. The integration resolver writes every inherited ref.
[recipe.gnome-shell]
component = "gnome-build-meta"
junction = "junctions/gnome-build-meta.bst"
upstream_element = "core/gnome-shell.bst"
element = "overrides/gnome-shell.bst"
refs = "project.refs"

# Settings without parental controls and with the Secure Shell row patch (D89); like Shell, it
# inherits gnome-build-meta's exact sources, not a separate HEAD track.
[recipe.gnome-control-center]
component = "gnome-build-meta"
junction = "junctions/gnome-build-meta.bst"
upstream_element = "core/gnome-control-center.bst"
element = "overrides/gnome-control-center.bst"
refs = "project.refs"

# GDM with SELinux support (D105); like Shell, it inherits gnome-build-meta's exact sources. Its
# local source, files/gdm, is a copy of gnome-build-meta's at the recipe's commit.
[recipe.gdm]
component = "gnome-build-meta"
junction = "junctions/gnome-build-meta.bst"
upstream_element = "core/gdm.bst"
element = "overrides/gdm.bst"
refs = "project.refs"

# Build-policy override; retain the exact FDSDK-selected libfuse source, not a new track.
[recipe.fuse3]
component = "freedesktop-sdk"
junction = "junctions/freedesktop-sdk.bst"
upstream_element = "components/fuse3.bst"
element = "overrides/fuse3.bst"
refs = "project.refs"

# Carries upstream's unreleased raster-printing fix as a patch (D84, K2); retain the exact
# FDSDK-selected libcupsfilters source, not a new track. Drop once FDSDK selects a release with it.
[recipe.libcupsfilters]
component = "freedesktop-sdk"
junction = "junctions/freedesktop-sdk.bst"
upstream_element = "components/libcupsfilters.bst"
element = "overrides/libcupsfilters.bst"
refs = "project.refs"
