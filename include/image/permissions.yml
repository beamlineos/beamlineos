variables:
  apply-permissions: |-
    apply_permissions() {
      while read -r mode path; do
        case "${mode}" in ''|'#'*) continue ;; esac
        if [ -e "$1${path}" ]; then chmod "${mode}" "$1${path}"; fi
      done < "%{datadir}/%{os-id}/image/permissions"
    }
