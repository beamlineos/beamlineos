# SPDX-License-Identifier: BSD-3-Clause
[package]
name = "beamline-image-reader"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"

[lib]
path = "reader.rs"
crate-type = ["cdylib"]

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
ruzstd = "=0.8.3"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1
