# SPDX-License-Identifier: MIT
name: build

on:
  workflow_dispatch:
    inputs:
      seed_local:
        description: Seed matching full-image prerequisites from the existing native cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beamline-hosted-build
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}

jobs:
  seed:
    if: >-
      github.repository == 'beamlineos/beamlineos' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'c-lin-chunyi' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, beamline-aarch64]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: ./ci/build-hosted seed-local
      env:
        SEED_LOCAL: ${{ inputs.seed_local }}
        BEAMLINE_SNAPSHOT_ROOT: ${{ vars.BEAMLINE_SNAPSHOT_ROOT }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      with:
        name: build-context
        path: out/hosted-build/context/
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-seed
        path: out/hosted-build/evidence/
        if-no-files-found: error
        retention-days: 30

  workers:
    needs: seed
    if: ${{ !cancelled() && needs.seed.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [base-posix, desktop, printing-scanning, installer]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: build-context
        path: out/hosted-build-input/context/
    - run: ./ci/build-hosted worker --group "$BUILD_GROUP"
      env:
        BUILD_GROUP: ${{ matrix.group }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-worker-${{ matrix.group }}
        path: out/hosted-build/evidence/
        if-no-files-found: error
        retention-days: 30

  assemble:
    needs: [seed, workers]
    if: ${{ !cancelled() && needs.seed.result == 'success' && needs.workers.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: build-context
        path: out/hosted-build-input/context/
    - uses: actions/download-artifact@v4
      with:
        pattern: build-worker-*
        path: out/hosted-build-input/workers/
    - run: ./ci/build-hosted assemble
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      with:
        name: image-manifest
        path: out/hosted-build/image-manifest.json
        if-no-files-found: error
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-installer
        path: out/hosted-build/images/installer/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-system
        path: out/hosted-build/images/system/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-posix
        path: out/hosted-build/images/posix/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-posix-devel
        path: out/hosted-build/images/posix-devel/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-desktop-gnome
        path: out/hosted-build/images/desktop-gnome/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: image-printing-scanning
        path: out/hosted-build/images/printing-scanning/
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-assemble
        path: out/hosted-build/evidence/
        if-no-files-found: error
        retention-days: 30

  test:
    needs: [seed, assemble]
    if: ${{ !cancelled() && needs.seed.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, beamline-aarch64]
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: build-context
        path: out/hosted-build-input/context/
    - uses: actions/download-artifact@v4
      with:
        pattern: image-*
        merge-multiple: true
        path: out/hosted-build-input/images/
    - run: ./ci/build-hosted test
      env:
        BEAMLINE_SNAPSHOT_ROOT: ${{ vars.BEAMLINE_SNAPSHOT_ROOT }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-vm
        path: out/hosted-build/evidence/
        if-no-files-found: error
        retention-days: 30

  publish:
    needs: [seed, assemble, test]
    if: ${{ !cancelled() && needs.seed.result == 'success' && needs.assemble.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: build-context
        path: out/hosted-build-input/context/
    - uses: actions/download-artifact@v4
      with:
        pattern: image-*
        merge-multiple: true
        path: out/hosted-build-input/images/
    - uses: actions/download-artifact@v4
      with:
        name: build-assemble
        path: out/hosted-build-input/assemble/
    - uses: actions/download-artifact@v4
      with:
        name: build-vm
        path: out/hosted-build-input/vm/
    - run: ./ci/build-hosted publish
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-publication
        path: out/hosted-build/evidence/
        if-no-files-found: error
        retention-days: 30
