# SPDX-License-Identifier: MIT
name: p1-publish

on:
  workflow_dispatch:
    inputs:
      page_only:
        description: Rebuild only the static download page from committed publications
        type: boolean
        default: false
      snapshot:
        description: Saved snapshot to publish and verify
        type: choice
        required: true
        default: '20261015.1430'
        options: ['20261015.1430', '20261015.1247']

permissions:
  contents: read

concurrency:
  group: p1-manual
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'beamlineos/beamlineos' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'c-lin-chunyi'
    runs-on: [self-hosted, macOS, ARM64, beamline-aarch64]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: ./ci/publish "$PUBLISH_SNAPSHOT" --repeat
      if: ${{ !inputs.page_only }}
      env:
        PUBLISH_SNAPSHOT: ${{ inputs.snapshot }}
        BEAMLINE_SNAPSHOT_ROOT: ${{ vars.BEAMLINE_SNAPSHOT_ROOT }}
        R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - run: ./ci/publish --refresh-page
      if: ${{ inputs.page_only }}
      env:
        R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p1-publish-${{ inputs.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: out/publish/report.json
        if-no-files-found: warn
        retention-days: 30
