# SPDX-License-Identifier: MIT




name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'beamlineos/beamlineos'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: ./ci/check-hosted
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: ./ci/test-images
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: images-reader-evidence
        path: |
          out/images-worker-test.json
          out/images-worker-performance.json
          out/images-worker-allocations.json
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      with:
        name: images-worker
        path: out/images-worker/
        retention-days: 30
        if-no-files-found: error
