# SPDX-License-Identifier: MIT




name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'beamlineos/beamlineos'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: ./ci/check-hosted
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: ./ci/test-images
