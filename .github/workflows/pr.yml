# SPDX-License-Identifier: MIT
#
# Hosted runners only orchestrate; the logic lives in ci/ (docs/spec.md §26).
# Full hosted builds (aarch64 + x86_64) arrive with milestone 0.1.

name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'beamlineos/beamlineos'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: ./ci/check
