# SPDX-License-Identifier: MIT






minimumLimaVersion: 2.0.0

base:
- template:_images/fedora-44

vmType: vz
arch: aarch64
cpus: 12
memory: 32GiB
disk: 200GiB


nestedVirtualization: true

mountType: virtiofs
mounts: []

containerd:
  system: false
  user: false





provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    systemctl disable --now chronyd.service 2>/dev/null || true
