# SPDX-License-Identifier: MIT




name: beamline

min-version: 2.5

element-path: elements


ref-storage: project.refs

aliases:
  (@): include/aliases.yml

(@):

- junctions/freedesktop-sdk.bst:include/runtime.yml

fatal-warnings:
- overlaps
- unaliased-url

options:
  arch:
    type: arch
    description: Machine architecture (native builds only)
    variable: arch
    values:
    - aarch64
    - x86_64

variables:
  (@): include/snapshot.yml

  
  
  os-id: beamline
  os-name: Beamline
  os-version: 0.0.1

  source-date-epoch: '1320937200'

  (?):
  - arch == "aarch64":
      efi-arch: aa64
      kernel-arch: arm64
      kernel-image: arch/arm64/boot/Image
      kernel-image-target: Image
      serial-console: ttyAMA0
  - arch == "x86_64":
      efi-arch: x64
      kernel-arch: x86
      kernel-image: arch/x86/boot/bzImage
      kernel-image-target: bzImage
      serial-console: ttyS0

environment:
  SOURCE_DATE_EPOCH: '%{source-date-epoch}'
  LC_ALL: C.UTF-8

sandbox:
  build-arch: '%{arch}'

plugins:
- origin: junction
  junction: junctions/buildstream-plugins.bst
  elements:
  - autotools
  - cmake
  - meson
  
  
  
  sources:
  - git
  - cargo
  - patch

- origin: junction
  junction: junctions/buildstream-plugins-community.bst
  sources:
  - git_repo
  
  
  - git_module

elements:
  
  meson:
    (@): include/meson-conf.yml

sources:
  git_repo:
    config:
      ref-format: git-describe
