# SPDX-License-Identifier: MIT
[workspace]
members = ["beamline-varlink", "beamlinectld", "beamlinectl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.190"
beamline-varlink = { path = "beamline-varlink" }
