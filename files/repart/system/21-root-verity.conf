# SPDX-License-Identifier: MIT
#
# The SYSTEM image's dm-verity hash tree (docs/spec.md §13, §14). Its partition UUID, like
# the data partition's, is derived from the root hash, so the initrd finds both from
# roothash= alone.

[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=system
SplitName=root-verity
Minimize=best
