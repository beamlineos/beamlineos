#
# Boot-time repart definitions (docs/spec.md §15). They match the partitions the image was
# built with (files/repart/virt), type by type and in order, and only let DATA grow; every
# other partition keeps its size, and none is relabelled.

[Partition]
Type=esp
SizeMinBytes=256M
SizeMaxBytes=256M
