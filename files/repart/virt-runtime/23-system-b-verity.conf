# SPDX-License-Identifier: MIT
#
# The free update slot carries the label systemd-sysupdate looks for (_empty). systemd-sysinstall
# leaves it out of the table and this repart creates it at first boot (docs/decisions.md D110);
# repart never relabels an existing slot, so an installed snapshot keeps its name.

[Partition]
Type=root-verity
Label=_empty
SizeMinBytes=64M
SizeMaxBytes=64M
