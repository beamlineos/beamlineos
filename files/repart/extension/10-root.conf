# SPDX-License-Identifier: MIT
#
# An extension image (docs/spec.md §8, docs/decisions.md D50): the sysext's /usr and /opt, or
# the confext's /etc, as EROFS in a root partition, so the paths inside are the paths after
# merging and the base policy's file contexts label it. A dm-verity hash tree and a
# signature over its root hash follow.

[Partition]
Type=root
Format=erofs
Compression=lz4hc
CopyFiles=/
Verity=data
VerityMatchKey=extension
Minimize=best
# The BuildStream sandbox filesystem cannot store the user.validatefs.* xattrs.
AddValidateFS=no
