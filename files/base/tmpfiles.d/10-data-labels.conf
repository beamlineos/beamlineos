# SPDX-License-Identifier: MIT
#
# DATA is labelled at runtime (docs/security.md §19.1): relabel the entries the image build
# creates there. Everything created later is labelled by whoever creates it.

z /data      - - - -
z /data/var  - - - -
z /data/home - - - -
# The extension images, one set per snapshot (docs/decisions.md D50).
Z /data/var/lib/beamline - - - -
# /etc's mutable layer, which the initrd rebuilt from the allowlist without labels
# (docs/decisions.md D56). systemd-confext.service applies these lines before it merges /etc
# (D112).
z /var/lib/extensions.mutable/etc/hostname - - - -
z /var/lib/extensions.mutable/etc/machine-info - - - -
z /var/lib/extensions.mutable/etc/machine-id - - - -
z /var/lib/extensions.mutable/etc/localtime - - - -
z /var/lib/extensions.mutable/etc/adjtime - - - -
z /var/lib/extensions.mutable/etc/locale.conf - - - -
z /var/lib/extensions.mutable/etc/vconsole.conf - - - -
