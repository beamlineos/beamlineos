#
# run0's password agent marks the terminal it asks on in /run/systemd/ask-password-block. The
# directory is P2 (docs/security-mls.md §7, D100) so that a run0 session may write it, but /run/systemd
# is P3: create it at boot, labelled from the file contexts, so the agent never has to.
d /run/systemd/ask-password-block 0755 root root -
