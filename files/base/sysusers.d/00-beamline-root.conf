#
# Root (docs/spec.md §18.1, docs/decisions.md D55): UID 0 stays as the system's identity, but
# no password unlocks it (sysusers sets an invalid one) and its shell is nologin, so no login
# opens a root shell. run0 is the only way to act as root: it starts the caller's own shell or
# command, in the confined admin domain. Not `u!`: that also expires the account, and
# pam_unix then refuses run0's root sessions. Sorted before systemd's
# basic.conf, so this definition wins; image/root-virt.bst applies it when the image is built.

u root 0 "Super User" /root /usr/bin/nologin
