[Unit]
Requires=beamline-etc-allowlist.service
After=beamline-etc-allowlist.service
ConditionPathIsDirectory=|/sysroot/var/lib

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-confext --root=/sysroot refresh --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
