# SPDX-License-Identifier: MIT
#
# initrd: merge /etc's mutable layer into /sysroot/etc before switch-root, after the layer has
# been reduced to the allowlist (docs/spec.md §14, docs/decisions.md D56), so PID 1 reads the
# final /etc from its first moment. Configuration extension images merge in the host
# (systemd-confext.service), which refreshes the same layer; only signed images would merge here.

[Unit]
Requires=beamline-etc-allowlist.service
After=beamline-etc-allowlist.service
ConditionPathIsDirectory=|/sysroot/var/lib

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-confext --root=/sysroot refresh --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
