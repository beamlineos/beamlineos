#
# homed's homes are btrfs filesystems that systemd-homework creates without SELinux labels, so a
# home's root would be unlabeled_t (docs/decisions.md D58). Label the homes' roots from the file
# contexts (user_home_dir_t) as root, before the user manager starts; the policy's type transitions
# label what the session creates below them. (%h would be the manager's home, /root.)

[Service]
ExecStartPre=-+/usr/bin/systemd-tmpfiles --create --inline "z /home/* - - - -"
