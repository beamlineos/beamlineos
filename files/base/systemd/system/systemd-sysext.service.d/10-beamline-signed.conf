# SPDX-License-Identifier: MIT
#
# Merge only signed, verity-protected extension images (docs/spec.md §8, docs/security.md
# §6.2, docs/decisions.md D50). The signature must validate against /usr/lib/verity.d.

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-sysext refresh --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=/usr/bin/systemd-sysext refresh --image-policy=root=signed+absent:usr=signed+absent
