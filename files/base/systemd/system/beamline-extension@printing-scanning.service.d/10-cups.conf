# Boot and refresh run tmpfiles after the merge. Stop CUPS before removing its code.
[Service]
ExecStop=
ExecStop=/usr/bin/systemctl stop "cup[s].service" "cup[s].socket" "cup[s].path"
ExecStop=/usr/bin/systemd-tmpfiles --remove --inline "r /run/extensions/%i.raw" "r /run/confexts/%i.raw"
