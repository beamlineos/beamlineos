#
# No first-boot questions about system settings (docs/spec.md §14, §18.1; docs/decisions.md D112).
# Settings come from the image, credentials and the allowlisted settings services; root stays
# locked. The kernel command line no longer turns every first-boot prompt off
# (systemd.firstboot=no), because the first account is asked for (beamline-first-user.service),
# so this unit asks nothing itself. It still applies the firstboot.* credentials, such as the
# locale systemd-sysinstall seals, and never a root password.

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-firstboot
ImportCredential=
ImportCredential=firstboot.*
