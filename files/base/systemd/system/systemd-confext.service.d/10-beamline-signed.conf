# SPDX-License-Identifier: MIT
#
# Merge only signed, verity-protected configuration extension images (docs/spec.md §8,
# docs/security.md §6.2, docs/decisions.md D50), and give /etc its mutable layer on DATA,
# /var/lib/extensions.mutable/etc (docs/spec.md §14, docs/decisions.md D56): --mutable=yes
# creates it when missing. SELinux decides which files in it may change. The service runs even
# when no confext is present, so /etc is always merged with its mutable layer.
# The initrd rebuilt that layer without labels (D56). The layer's files are labelled first, so
# this merge's fresh overlay reads them labelled: the initrd's overlay had cached them unlabelled
# when PID 1 first read them, and relabelling them on DATA later never reaches an overlay already
# mounted. A second boot's greeter could not read /etc/machine-id (unlabeled_t; D112). The merge
# must happen even when the set of confexts is the initrd's (no extension linked): refresh skips
# an unchanged set unless --always-refresh=yes, and the initrd's overlay then stays (D113).

[Unit]
ConditionPathIsDirectory=|/var/lib

[Service]
ExecStartPre=/usr/bin/systemd-tmpfiles --create --prefix=/var/lib/extensions.mutable/etc
ExecStart=
ExecStart=/usr/bin/systemd-confext refresh --always-refresh=yes --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=/usr/bin/systemd-confext refresh --always-refresh=yes --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
