[Unit]
ConditionPathIsDirectory=|/var/lib

[Service]
ExecStartPre=/usr/bin/systemd-tmpfiles --create --prefix=/var/lib/extensions.mutable/etc
ExecStart=
ExecStart=/usr/bin/systemd-confext refresh --always-refresh=yes --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=/usr/bin/systemd-confext refresh --always-refresh=yes --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
