#
# The installer medium (docs/decisions.md D113). Its command line boots basic.target, since the
# installer's units arrive only with the installer extension, which the root's systemd-sysext
# merges. Once it has, start the installer, not the default target: that would bring up the
# multi-user system, homed's first-boot wizard and the gettys beside it.

[Service]
ExecStart=
ExecStart=/usr/bin/systemctl start --no-block beamline-installer.target
