#
# The snapshot's UKIs from the medium (production, development, RecoveryOS stub) as type #2 entries
# in /EFI/Linux, where systemd-sysupdate and boot counting expect them (D52). sysinstall's
# `bootctl link` adds a type #1 entry for the production UKI besides (D110).

[Partition]
Type=xbootldr
Label=XBOOTLDR
Format=vfat
CopyFiles=/boot/beamline/uki:/EFI/Linux
SizeMinBytes=1G
SizeMaxBytes=1G
