#
# systemd-sysinstall's target layout (docs/spec.md §15; docs/decisions.md D106, D110, D113). The ESP
# receives the whole boot chain from the installer extension (/usr/lib/beamline/esp):
#   EFI/Beamline/  Debian's shim, systemd-boot as its second stage (grubaa64.efi), MokManager,
#                  and BOOTAA64.CSV, from which the fallback creates the "Beamline" boot entry
#   EFI/BOOT/      shim, the fallback and MokManager, for firmware without that entry
#   loader/        Beamline's loader.conf
#   beamline.der   the certificate MokManager enrolls if the MOK is ever lost
# sysinstall runs with --boot-loader=no, so nothing replaces them.

[Partition]
Type=esp
Format=vfat
CopyFiles=/usr/lib/beamline/esp:/
SizeMinBytes=256M
SizeMaxBytes=256M
