# SPDX-License-Identifier: MIT
#
# cupsd's ServerRoot and configuration on DATA (etc/cups/cups-files.conf, docs/decisions.md
# D58). Both configuration files are copied from the image once; cupsd corrects their ownership
# and cupsctl changes them there.
d /var/lib/cups 0755 root lp -
C /var/lib/cups/cupsd.conf - - - - /etc/cups/cupsd.conf
C /var/lib/cups/cups-files.conf - - - - /etc/cups/cups-files.conf
# Its spool, cache and log directories, with cupsd's own modes, created here so that they get their
# SELinux type at creation.
d /var/spool/cups 0710 root lp -
d /var/spool/cups/tmp 1770 root lp -
d /var/cache/cups 0770 root lp -
d /var/log/cups 0755 root lp -
# cupsd's state has an SELinux type of its own (docs/decisions.md D95). Relabel it at every boot,
# so state an older snapshot created gets the type this snapshot's policy gives it.
Z /var/lib/cups - - - -
Z /var/spool/cups - - - -
Z /var/cache/cups - - - -
Z /var/log/cups - - - -
