#
# CUPS file and directory settings (cups-files.conf(5)). FDSDK's settings, plus cupsd's state on
# DATA: /etc is read-only except its allowlist (docs/spec.md §14), and cupsd writes its
# ServerRoot (printer queues, PPDs, certificates), the printcap, and cupsd.conf, whose ownership
# it corrects to root:lp, which the image cannot carry (docs/decisions.md D31, D58).
# cups.service runs cupsd with copies of cupsd.conf and of this file in /var/lib/cups, made at the
# first boot.

ServerRoot /var/lib/cups
Printcap /var/lib/cups/printcap
SystemGroup root wheel
PeerCred on
AccessLog /var/log/cups/access_log
ErrorLog /var/log/cups/error_log
PageLog /var/log/cups/page_log
